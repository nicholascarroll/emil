name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # A red cell must not cancel the others: the whole point of a
      # matrix is finding out which cells are red.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          # macOS uses clang by default, skip gcc
          - os: macos-latest
            compiler: gcc

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build with ${{ matrix.compiler }}
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          make darwin
        else
          make CC=${{ matrix.compiler }}
        fi
    
    - name: Run unit tests
      run: make test

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    
    steps:
    - uses: actions/checkout@v4
    - name: Build and test with sanitizers
      run: make sanitize

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4    
    - name: CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: cpp    
    - name: Build for analysis
      run: make    
    - name: Run CodeQL
      uses: github/codeql-action/analyze@v3

  msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MSYS
          install: >-
            msys2-devel msys2-runtime-devel gcc make
            diffutils
      - name: Build and Test
        run: |
          make
          make test


  openindiana:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Build and Test on OpenIndiana
          uses: vmactions/openindiana-vm@v1
          with:
            prepare: |
              pkg install --accept developer/gcc-14 developer/build/make
              
            run: |
              export PATH="/usr/bin:/usr/gnu/bin:$PATH"
              ln -s /usr/bin/gcc-14 /usr/bin/cc
              export CFLAGS="-D_XOPEN_SOURCE=600 -D__EXTENSIONS__ -std=c99"
              
              echo "--- Building Emil ---"
              make CC=gcc-14 CFLAGS="$CFLAGS"
              
              echo "--- Running Tests ---"
              make CC=gcc-14 CFLAGS="$CFLAGS" test

  netbsd:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Build on NetBSD
          uses: vmactions/netbsd-vm@v1
          with:
            run: |
              make CC=cc
              make test  
  haiku:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Build on Haiku
          uses: vmactions/haiku-vm@v1
          with:
            # Pinned to R1/beta5 (hrev57937, Sep 2024).  The action's
            # default moved to r1beta6 (hrev59866, Aug 2026) when the
            # floating v1 tag was rebuilt, and every decoder_pty
            # scenario began failing on that image while all 35 unit
            # suites kept passing.
            #
            # The editor is not implicated.  Driving `emil --version`
            # -- which prints one line and exits before raw mode and
            # before the event loop -- through the harness's pty
            # produced zero bytes and a child that never exited, and
            # markers written by the harness's own forked child never
            # appeared either.  Nothing in the editor had run.
            #
            # The harness builds its pty by hand: posix_openpt,
            # grantpt, unlockpt, fork, setsid, open the slave, dup2,
            # exec.  On Haiku, whose fork() is emulated, a child that
            # calls into libroot before exec can deadlock on locks
            # inherited from the parent -- which matches exactly what
            # was observed: a child that is alive, has written
            # nothing, and never becomes the editor.  It also has
            # precedent here: spawnEmilOpts already carries a STREAMS
            # workaround for illumos, whose freshly opened pty slave
            # has no terminal semantics until ptem and ldterm are
            # pushed.
            #
            # This pin restores a known-good image; it does not fix
            # the harness.  The real fix is to stop doing work
            # between fork and exec -- posix_spawn with file actions,
            # which is what the editor itself uses for subprocesses
            # (design §3.17) and what the harness should have used.
            # Left undone deliberately: replacing the spawn path of
            # the one test that cannot run outside CI, without being
            # able to run it on the platform that is broken, risks
            # the targets that currently pass.
            release: r1beta5
            prepare: pkgman install -y gcc make
            run: |
              make CC=gcc
              make test
  
  alpine_musl:
      runs-on: ubuntu-latest
      container: alpine:latest
      steps:
        - name: Install dependencies
          run: apk add --no-cache build-base git
        - uses: actions/checkout@v4
        - name: Build and Test
          run: |
            make CC=gcc
            cat /etc/os-release 2>/dev/null | grep ^PRETTY_NAME=
            ldd --version 2>&1 | head -n1
            make test

  riscv-native:
    runs-on: ubuntu-24.04-riscv   # ← Install RISE RISC-V Runners GitHub App first!
    
    steps:
      - uses: actions/checkout@v4
      - name: Build Emil Natively (RISC-V 64-bit)
        run: |
          make clean
          make CC=gcc CFLAGS="-O2 -g"
      - name: Run Native Tests
        run: |
          echo "Running on native RISC-V: $(uname -m)"
          ./emil --version
          make test

  powerpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test on PowerPC (ppc64le)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ppc64le
          distro: ubuntu24.04
          githubToken: ${{ github.token }}   # for image caching
          install: |
            apt-get update -y
            apt-get install -y gcc make
          run: |
            make CC=gcc
            make test

  s390x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test on IBM Z (s390x Big-Endian)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: s390x
          distro: ubuntu24.04
          githubToken: ${{ github.token }}  
          install: |
            apt-get update -y
            apt-get install -y gcc make
          run: |
            make CC=gcc
            make test

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y gcc gmake git
          run: |
            export CC=gcc
            export CFLAGS="-O2 -pipe -std=c99 -Wall -Wextra -Wpedantic -D_DEFAULT_SOURCE -D_BSD_SOURCE"
            echo "--- Building Emil on FreeBSD ---"
            gmake CC=$CC CFLAGS="$CFLAGS"
            echo "--- Running Tests ---"
            gmake CC=$CC CFLAGS="$CFLAGS" test

  y2038:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Y2038 — build and test on 32-bit ARM (armv7 Debian Bullseye)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: bullseye
          githubToken: ${{ github.token }}
          install: |
            apt-get update -y
            apt-get install -y gcc make
          run: |
            echo "--- Confirm this platform has 32-bit time_t ---"
            cc -std=c99 -Wall -Wextra -Wpedantic -o confirm_y2038_bug tests/confirm_y2038_bug.c
            ./confirm_y2038_bug

            echo ""
            echo "--- Building Emil ---"
            make CC=gcc
            echo "--- Running Tests ---"
            make test

  # Builds emil.wasm, runs the unit suites under wasmer, then the
  # end-to-end smoke test.  The smoke test is what makes this worth
  # gating on: a wasi-sdk/wasix-libc version mismatch links cleanly and
  # only shows up as a trap on the first open(), so a build-only job
  # would go green on a binary that cannot read a file.
  wasix:
    runs-on: ubuntu-latest
    env:
      WASIX_PREFIX: ${{ github.workspace }}/.wasix-toolchain
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/wasix-toolchain
        with:
          prefix: ${{ github.workspace }}/.wasix-toolchain

      # A WASIX sandbox starts empty: wasmer will exec a wasm module out
      # of the mapped filesystem, but nothing puts a shell there.  Not a
      # missing syscall, a missing file -- and without it test_shell and
      # test_subprocess both die at exit 45 with no /bin/sh to spawn.
      # This script builds dash and a handful of sbase utilities for the
      # target; make picks it up through $(wildcard ...) and mounts it.
      - name: Build the WASIX sandbox (/bin/sh and friends)
        run: |
          ./tests/wasix/sandbox.sh "$WASIX_PREFIX" ./wasix-sandbox

      - name: Build and test for WASIX
        run: |
          make wasix-test \
            WASI_SDK="$WASIX_PREFIX/wasi-sdk" \
            WASIX_SYSROOT="$WASIX_PREFIX/wasix-sysroot/sysroot"

      - name: Upload emil.wasm
        uses: actions/upload-artifact@v4
        with:
          name: emil-wasm
          path: emil.wasm
          if-no-files-found: error

  # Advisory only.  Cross-builds the editor for Genode on x86_64 with
  # goa, against the Genode libc and posix APIs pulled from
  # depot.genode.org, then runs it on base-linux -- a whole Genode
  # system as ordinary Linux processes, so no QEMU, hardware or display.
  #
  # The signal is portability of a kind no other target here provides.
  # Genode is not a Unix: a component has no ambient filesystem and no
  # shell, and sees only the VFS its runtime configuration grants it.
  # It does have fork() -- its libc clones the address space into a
  # fresh component -- but the editor spawns through posix_spawn and
  # never takes that path.  What is absent is a /bin/sh to spawn, so
  # EMIL_DISABLE_SHELL compiles those paths out exactly as the Android
  # target does; this is the only job that compiles that configuration.
  # What is actually checked is that the rest holds up against a
  # FreeBSD-derived libc (goa compiles with -D__FreeBSD__=12
  # -D__BSD_VISIBLE -nostdinc) under a capability-based component model.
  #
  # Scope: the editor is built, linked, and run -- `emil --version` on
  # base-linux, then the unit suites.  Three suites are not built (see
  # UNBUILDABLE in tests/genode/emil/Makefile.in) because the code they
  # test is compiled out here or needs a host compiler.  The other 31
  # run, each scored by its own exit status as on every other target.
  # Five of them fail: Genode ships only the C locale, so
  # wcwidth does not report 2 for CJK.  They are reported as failures,
  # not excused -- the editor decodes UTF-8 itself and only display
  # width is affected, but a red suite is the honest signal.  The pty
  # test does not run here; it is Linux and macOS only.
  #
  # Not gating, for reasons outside this repository: it depends on
  # codeberg.org for goa and the toolchain, on depot.genode.org for the
  # API archives, and on unprivileged user namespaces for goa's
  # bubblewrap sandbox.  Any of the three can fail without the editor
  # being implicated.  goa is tracked at main rather than pinned, so
  # upstream can change under us; last verified against goa cd34da5
  # (2026-08-24) with genode-toolchain-25.05 and api/libc 2026-03-11.
  #
  # Two compiler warnings are expected and are not regressions; see
  # tests/genode/README.md.  Genode's <termios.h> pulls in
  # sys/ttydefaults.h, which redefines CTRL, and its sys/cdefs.h uses
  # _Generic, which -Wpedantic rejects under -std=c99.
  genode:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GOA_DIR: ${{ github.workspace }}/.goa
    steps:
      - uses: actions/checkout@v4

      # goa is a Tcl/expect program; bubblewrap is its sandbox, and
      # squashfuse is how it mounts the toolchain image it downloads.
      - name: Install goa prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            expect tcl bubblewrap squashfs-tools squashfuse \
            curl wget git gnupg make sed tar xz-utils diffutils findutils

      # Ubuntu 24.04 restricts unprivileged user namespaces through
      # AppArmor, and bubblewrap needs them.  Without this, bwrap fails
      # with a bare permission error that names neither cause nor cure.
      # Tolerated if absent, in case the runner image changes.
      - name: Permit unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Genode moved from GitHub to Codeberg; goa rewrites any lingering
      # GitHub remote to Codeberg itself on startup.
      - name: Fetch goa
        run: |
          git clone --depth 1 https://codeberg.org/genodelabs/goa.git "$GOA_DIR"
          echo "$GOA_DIR/bin" >> "$GITHUB_PATH"

      # var/ is ~680M, nearly all of it the toolchain: a 230M tarball
      # plus the squashfs made from it.  Both must be kept -- goa's
      # install rule makes the squashfs from the tarball with no
      # .SECONDARY, so deleting the tarball to halve the cache only
      # makes the next run download it again.
      #
      # Keyed on used_apis and on the two goa files that decide what
      # gets downloaded: install_tool.mk holds the toolchain version and
      # its SHA, goarc the depot pins.  Hashing goa's whole tree would
      # miss the cache on every unrelated upstream commit.
      - name: Cache Genode depot and toolchain
        uses: actions/cache@v4
        with:
          path: tests/genode/emil/var
          key: genode-${{ hashFiles('tests/genode/emil/used_apis') }}-${{ hashFiles('.goa/share/goa/lib/install_tool.mk', '.goa/share/goa/goarc') }}

      # Fetch the toolchain ourselves rather than letting goa do it.
      #
      # goa's install_tool.mk sets `ECHO := echo -e` but, unlike its
      # sibling sync_http.mk, never sets `SHELL := bash`.  make therefore
      # runs the rule under /bin/sh, which on Ubuntu is dash, whose echo
      # has no -e and prints it literally.  The SHA line handed to
      # `sha256sum -c` comes out as "-e <sha>  <file>", which cannot be
      # parsed, so the check fails, the rule deletes the freshly
      # downloaded 230M tarball, and the build aborts.  This is not
      # intermittent: it fails on any host where /bin/sh is dash, which
      # includes ubuntu-latest.  Verified directly -- a byte-perfect
      # tarball with the correct hash fails under dash and passes under
      # bash.
      #
      # Nothing here can fix goa's makefile: make deliberately ignores
      # SHELL from the environment, so it cannot be overridden from
      # outside.  Instead we place a verified tarball where the rule
      # expects one; make then sees its target up to date and never runs
      # the broken recipe.  The pins are read out of install_tool.mk so
      # this cannot drift from whatever goa revision was cloned above.
      #
      # Remove this step once goa adds `SHELL := bash` to
      # install_tool.mk.
      - name: Pre-seed the Genode toolchain
        shell: bash
        run: |
          set -euo pipefail
          mk="$GOA_DIR/share/goa/lib/install_tool.mk"
          tool=$(sed -n 's/^TOOLS *:= *//p' "$mk" | head -1)
          url=$(sed -n "s|^URL($tool) *:= *||p" "$mk" | head -1)
          sha=$(sed -n "s/^SHA($tool) *:= *//p" "$mk" | head -1)
          if [ -z "$tool" ] || [ -z "$url" ] || [ -z "$sha" ]; then
            echo "could not read the toolchain pins from $mk"; exit 1
          fi
          dest="tests/genode/emil/var/install/download/$(basename "$url")"

          # A cancelled or timed-out run can leave a half-written
          # .squashfs behind, and goa will never rebuild it: the file
          # exists and is newer than the tarball, so make considers it
          # up to date.  Every later build then fails with "Installation
          # of tool chain ... failed", which names neither the file nor
          # the cause.  The image is derived, so checking it and
          # deleting a bad one costs nothing and stops one cancelled job
          # from poisoning the cache for every run afterwards.
          #
          # Both halves of the check are needed.  A squash killed early
          # has no valid superblock, so `unsquashfs -s` fails outright.
          # One killed late has a good superblock over a truncated body,
          # which `unsquashfs -s` happily accepts -- so the size it
          # declares is compared against the size on disk.
          sqfs="tests/genode/emil/var/install/download/${tool}.squashfs"
          if [ -f "$sqfs" ]; then
            declared=$( { unsquashfs -s "$sqfs" 2>/dev/null \
                          | sed -n 's/^Filesystem size \([0-9]*\) bytes.*/\1/p'; } || true)
            actual=$(stat -c %s "$sqfs")
            if [ -z "$declared" ] || [ "$actual" -lt "$declared" ]; then
              echo "::warning::discarding a corrupt toolchain image (probably a cancelled run)"
              rm -f "$sqfs"
            fi
          fi

          if [ -f "$dest" ] && echo "$sha  $dest" | sha256sum -c --status; then
            echo "toolchain restored from cache: $dest"
            exit 0
          fi
          echo "fetching $tool"
          mkdir -p "$(dirname "$dest")"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$dest" "$url"
          echo "$sha  $dest" | sha256sum -c -

      # Sources live at the repository root; goa requires them under
      # <project>/src.  See tests/genode/stage.sh for why they are
      # copied rather than linked.
      - name: Stage sources into the goa project
        run: ./tests/genode/stage.sh

      # Retried once, for the same reason rundir.sh retries; see there.
      - name: Cross-build for Genode (x86_64)
        run: |
          goa build -C tests/genode/emil --arch x86_64 || {
            echo "::warning::first goa build attempt failed; retrying once"
            goa build -C tests/genode/emil --arch x86_64
          }

      - name: Confirm a Genode binary was produced
        run: |
          bin=tests/genode/emil/var/build/x86_64/emil
          test -f "$bin" || { echo "no emil binary at $bin"; exit 1; }
          file "$bin"
          # A Genode component is an ELF linked against Genode's own
          # dynamic linker.  A host-toolchain binary would also be an
          # ELF, so the interpreter is what distinguishes them.
          file "$bin" | grep -q "ELF 64-bit LSB executable, x86-64" \
            || { echo "not an x86-64 ELF executable"; exit 1; }
          file "$bin" | grep -q "interpreter ld.lib.so" \
            || { echo "not linked against Genode's ld.lib.so"; exit 1; }

      # Actually run the editor, rather than only linking it.  `emil
      # --version` prints and exits from main() before raw mode and
      # before the event loop, so it needs no terminal -- which is what
      # makes it the one editor path that can run headless today.
      - name: Run emil --version on Genode
        shell: bash
        run: |
          set -euo pipefail
          ./tests/genode/rundir.sh tests/genode/emil x86_64 \
            tests/genode/smoke-runtime

          # set +e around the run: the whole point is to inspect the
          # component's exit status, and set -e would abort the step
          # before it could be read.
          set +e
          out=$(./tests/genode/run_component.sh tests/genode/emil/var/run emil 60)
          status=$?
          set -e
          echo "emil said: $out (exit $status)"

          # The version is defined once, in the top-level Makefile.  If
          # the editor reported "unknown" here, -DEMIL_VERSION failed to
          # reach the cross build and the binary would be lying about
          # itself -- which links and runs, so only a check like this
          # catches it.
          version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*\(.*\)/\1/p' Makefile | head -1)
          test "$out" = "emil $version" \
            || { echo "expected \"emil $version\""; exit 1; }
          test "$status" -eq 0 || { echo "non-zero exit"; exit 1; }

      # The editor's own suites, cross-built by the same toolchain and
      # run on a real Genode system.  Not a duplicate of the FreeBSD job
      # even though Genode's libc is FreeBSD-derived: here the
      # file-based suites exercise fileio.c against Genode's VFS, with
      # no Unix kernel underneath at all.
      - name: Run unit suites on Genode
        shell: bash
        run: |
          set -euo pipefail
          ./tests/genode/rundir.sh tests/genode/emil x86_64 \
            tests/genode/test-runtime tests/genode/test-archives
          ./tests/genode/run_suites.sh tests/genode/emil emil 60

      - name: Upload Genode binary
        uses: actions/upload-artifact@v4
        with:
          name: emil-genode-x86_64
          path: tests/genode/emil/var/build/x86_64/emil
          if-no-files-found: error

  # Runs the unit suites inside a real Redox system.
  #
  # redoxer boots Redox under QEMU and execs a binary in it, which is the
  # only way to run a Redox binary short of hardware.  One VM boot per
  # suite, so this is minutes, not seconds.
  #
  # Developed against a working local setup: 34 suites cross-compiled,
  # 31 passing inside the VM, on QEMU without KVM.  The three that do
  # not pass are left failing rather than skipped, so this job is
  # expected to be red until they are resolved -- the per-suite lines in
  # the log are the point, not the tick.
  #
  #   subprocess  test_subprocess_signal_kills_pipeline: got_eof is
  #               false.  Killing a pipeline with a signal does not
  #               surface EOF to the read side on Redox.  Genuine, and
  #               not yet diagnosed to either side of the boundary.
  #
  #   warnings    Two failures, only one of them about Redox.
  #               test_no_duplicate_buffer_for_symlink_to_open_file is
  #               the standing #128 reminder and fails everywhere by
  #               design.  test_relock_reports_conflict_when_rival_-
  #               takes_the_lock is a real difference: three assertions
  #               about fcntl locks across fork fail here and pass on
  #               glibc.
  #
  #   regex_semantics  test_chunk_stays_within_cancel_budget asserts a
  #               64 KiB chunk matches within 250 ms.  Measured without
  #               KVM, where every instruction is emulated, so the
  #               number means nothing about Redox.  The step below
  #               reports which case applies so the result can be read.
  #
  # Three things learned the hard way, all load-bearing:
  #
  #   rsync must be installed.  redoxer copies the folder into the guest
  #   with it and fails with a bare "No such file or directory" if it is
  #   missing, which reads like a missing binary rather than a missing
  #   tool.
  #
  #   --folder copies the whole directory into a fixed-size disk image.
  #   The source tree is about 5 MB and fits; a tree with large
  #   artifacts in it does not, and the failure is a RedoxFS "No space
  #   left on device" during the copy, not an obvious size complaint.
  #
  #   redoxer does not reliably report the child's exit status: measured
  #   at 4 wrong in 10 on one suite, while that suite printed correct
  #   output and a clean summary 10 times out of 10.  RUNNER_CONSOLE in
  #   tests/run_tests.sh exists for this and takes the verdict from the
  #   suite's own summary instead.  Do not "simplify" it back to $?.
  redox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REDOX_PREFIX: ${{ github.workspace }}/.redox
    steps:
      - uses: actions/checkout@v4

      # redoxer 0.2.63 decides whether to pass -accel kvm with
      # Path::new("/dev/kvm").exists() -- presence, not access.  A GitHub
      # runner has the device node but does not grant the runner user
      # access to it, so the check says yes, QEMU is asked for KVM, and
      # it dies with "Could not access KVM kernel module: Permission
      # denied" before the guest ever boots.  Upstream has since replaced
      # that check with a real open(), but the fix is in no release, and
      # 0.2.63 has no REDOXER_USE_KVM override either.  The only lever
      # from out here is /dev/kvm itself.
      #
      # So: grant access, which is what we want anyway (KVM is faster and
      # is the only way the regex_semantics timing assertion means
      # anything).  Failing that, take the node out of redoxer's way so
      # its existence check comes back false and it picks TCG, which is
      # the path that works.
      #
      # Note that `test -e` is the same wrong question redoxer asks.
      # Access is established by opening the device and issuing
      # KVM_GET_API_VERSION, which is what QEMU will do moments later.
      - name: Runner capabilities and KVM access
        run: |
          # The runner invokes this with bash -e; every branch below is a
          # degradation path, so errexit is explicitly off.
          set +e
          cat > /tmp/kvm_probe.py <<'PROBE'
          import fcntl, os, sys
          try:
              fd = os.open('/dev/kvm', os.O_RDWR)
              fcntl.ioctl(fd, 0xAE00)   # KVM_GET_API_VERSION
              os.close(fd)
          except Exception as e:
              print(f"/dev/kvm not usable: {e}")
              sys.exit(1)
          print("/dev/kvm is usable")
          PROBE

          ls -la /dev/kvm 2>/dev/null || echo "no /dev/kvm device node"

          if ! python3 /tmp/kvm_probe.py; then
            echo "granting access to /dev/kvm"
            printf 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"\n' \
              | sudo tee /etc/udev/rules.d/99-kvm-all.rules >/dev/null || true
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 0666 /dev/kvm 2>/dev/null || true
            ls -la /dev/kvm 2>/dev/null || true
          fi

          if python3 /tmp/kvm_probe.py; then
            echo "KVM enabled: the VM boots quickly and timings are meaningful."
          elif [ -e /dev/kvm ]; then
            # Present but unusable is the one combination redoxer 0.2.63
            # cannot survive: it will ask for KVM and QEMU will refuse.
            echo "::warning::/dev/kvm exists but is not usable; hiding it so"
            echo "redoxer falls back to TCG emulation."
            sudo mv /dev/kvm /dev/kvm.unavailable || true
            echo "Everything still runs, just slowly, and the regex_semantics"
            echo "timing assertion is then measuring the emulator, not Redox."
          else
            echo "::warning::no /dev/kvm -- QEMU uses TCG emulation."
            echo "Slow, and the regex_semantics timing assertion is measuring"
            echo "the emulator, not Redox."
          fi
          nproc; free -m | head -2

      # rsync is not optional; see the note at the top of this job.
      - name: Install QEMU and rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 rsync
          qemu-system-x86_64 --version | head -1
          rsync --version | head -1

      - uses: ./.github/actions/redox-toolchain
        with:
          prefix: ${{ github.workspace }}/.redox

      - name: Cache redoxer
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/redoxer
          key: redoxer-${{ runner.os }}-locked-v1

      # --locked is load-bearing.  Without it cargo resolves
      # redox_syscall 0.7.5 and 0.9.3 into one graph and redox_installer
      # fails to compile against both: "expected fn(syscall::error::-
      # Error), found fn(syscall::Error)".  The packaged lockfile pins a
      # combination that builds.
      - name: Install redoxer
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/redoxer" ]; then
            echo "redoxer restored from cache"
          else
            cargo install --locked redoxer
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The smallest question first: does anything run at all?  `emil
      # --version` returns from main() before raw mode and before the
      # event loop, so it needs no terminal.  If this fails, every suite
      # below fails for the same reason and this is where to look.
      - name: Toolchain provenance
        run: |
          tc="$REDOX_PREFIX/redox-toolchain"
          "$tc/bin/x86_64-unknown-redox-gcc" -v 2>&1 | tail -3
          echo "--- build this toolchain came from ---"
          cat "$tc/SHA256SUM.provenance"
          echo "--- relibc's regoff_t ---"
          # Advisory, and printed on every run on purpose.  relibc
          # declares regoff_t as size_t, which POSIX requires to be
          # signed; region.c reads the field through matchOff() to cope.
          grep -n 'regoff_t' "$tc/x86_64-unknown-redox/include/regex.h" || true

      - name: Cross-build emil
        run: |
          make clean
          make redox REDOX_TOOLCHAIN="$REDOX_PREFIX/redox-toolchain" 2>&1 \
            | tee /tmp/redox-build.log

      # Two warnings are expected, both from relibc annotating setitimer
      # as deprecated; the editor uses it for the write timeout in
      # fileio.c and has no replacement on this target.
      - name: Report build warnings
        run: |
          echo "--- all warnings ---"
          grep -E 'warning:' /tmp/redox-build.log || echo "(none)"
          n=$(grep -c 'warning:' /tmp/redox-build.log || true)
          echo "total: $n (2 expected: setitimer deprecated, x2)"

      # A Redox binary and a host Linux binary are both x86-64 ELF, so
      # `make` producing output proves nothing about which compiler made
      # it.  The interpreter separates them: Redox links against
      # /lib/ld64.so.1, glibc against /lib64/ld-linux-x86-64.so.2.
      - name: Confirm this is a Redox binary and not a host one
        run: |
          set -euo pipefail
          file emil
          if ! file emil | grep -q 'ELF 64-bit LSB executable, x86-64'; then
            echo "::error::emil is not an x86-64 ELF executable"; exit 1
          fi
          if file emil | grep -q 'ld-linux'; then
            echo "::error::emil links the host loader -- the cross compiler never ran"
            exit 1
          fi
          if ! file emil | grep -q 'interpreter /lib/ld64.so.1'; then
            echo "::error::emil is not linked against the Redox loader"; exit 1
          fi
          echo "OK: Redox ELF, interpreter /lib/ld64.so.1"

      - name: Smoke test - emil --version inside Redox
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*\(.*\)/\1/p' Makefile | head -1)
          mkdir -p /tmp/redox-smoke && cp emil /tmp/redox-smoke/
          cd /tmp/redox-smoke
          redoxer exec --folder . -- ./emil --version 2>&1 | tee /tmp/smoke.log
          # Verdict from output, not exit status; see the note above.
          grep -q "emil $version" /tmp/smoke.log
          echo "OK: emil $version ran on Redox"

      - name: Run the unit suites inside Redox
        run: make redox-run REDOX_TOOLCHAIN="$REDOX_PREFIX/redox-toolchain"

      - name: Upload the Redox binary
        # Unconditional: this step used to live in a build-only job
        # where nothing before it could fail.  It now follows the suite
        # run, so without this a red suite means no artifact at all.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emil-redox-x86_64
          path: emil
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== smoke log ==="
          cat /tmp/smoke.log 2>/dev/null || echo "(none)"
          echo "=== redoxer ==="
          which redoxer && redoxer --help | head -3 || echo "(not installed)"
          du -sh ~/.redoxer 2>/dev/null || echo "(no ~/.redoxer)"
          echo "=== tree size copied into the guest ==="
          du -sh . ; find . -type f | wc -l
          echo "=== binary ==="
          file emil 2>/dev/null || echo "(no emil)"
          cat .build-tag 2>/dev/null || echo "(no build tag)"
          echo "=== kvm/qemu ==="
          ls -la /dev/kvm 2>/dev/null || echo "(no /dev/kvm -- TCG, slow)"
          qemu-system-x86_64 --version | head -1 || true

  # Advisory only.  Runs the editor's unit suites on Asterinas, a Linux
  # ABI-compatible OS kernel written in Rust, booted under QEMU.
  #
  # The signal is different in kind from every other target.  Nothing is
  # cross-compiled: Asterinas implements the Linux syscall ABI on x86-64
  # and the dev container is x86-64 Linux, so these are ordinary Linux
  # ELF binaries -- the same shape the ubuntu-latest job builds.  What is
  # under test is the kernel, not the libc.  Genode asks whether the
  # editor survives an unfamiliar libc; this asks whether it survives an
  # unfamiliar kernel underneath a familiar one.
  #
  # Not gating, for three reasons.  Asterinas is pre-production by its
  # own account (x86-64 is Tier 1 with full CI and 230+ syscalls, but
  # their stated 2026 goal is still advancing *toward* production), so a
  # syscall gap is a plausible red that is not the editor's to fix.  The
  # initramfs injection is layout-dependent -- see
  # tests/asterinas/inject.sh, and note the --old-file flag below, which
  # is load-bearing.  And the dev image is pulled from Docker Hub rather
  # than built here.
  #
  # Scope: the unit suites run for real, in one boot.  The pty scenarios
  # are built and run but are advisory even within this advisory job;
  # their result is printed after the verdict and never affects it.  See
  # tests/asterinas/README.md.
  asterinas:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    container:
      # Must be kept in step with ASTER_REF below: the initramfs is
      # built by the Nix in this image against that checkout.
      image: asterinas/kernel-dev:0.18.1-20260805
      options: --privileged -v /dev:/dev
      volumes:
        # Asterinas's own CI maps these so the container can delete
        # them; the Nix build needs the ~16GB they occupy on a
        # free-tier runner.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    env:
      ASTER_REF: v0.18.1
      ASTER_DIR: /tmp/asterinas
    steps:
      - name: Free disk space
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/* || true

      - uses: actions/checkout@v4

      # Built first, and on its own step, so that a plain compile
      # failure is reported as one rather than surfacing twenty minutes
      # later as an empty initramfs.
      - name: Build emil and the unit suites (static, x86-64 Linux)
        run: ./tests/asterinas/build_payload.sh /tmp/payload

      - name: Fetch Asterinas
        run: |
          git clone --depth 1 --branch "$ASTER_REF" \
            https://github.com/asterinas/asterinas "$ASTER_DIR"

      # Nix builds the initramfs; the image ships the prebuilt packages
      # this resolves against, so it is mostly a cache hit.  KVM is used
      # when the runner exposes /dev/kvm and TCG emulation otherwise --
      # correctness is identical, only speed differs, and the timeout
      # above is sized for the slow path.
      - name: Build the Asterinas initramfs
        working-directory: /tmp/asterinas
        run: |
          if [ -e /dev/kvm ]; then echo "ENABLE_KVM=1" >> "$GITHUB_ENV"
          else echo "::notice::no /dev/kvm; falling back to TCG emulation"
               echo "ENABLE_KVM=0" >> "$GITHUB_ENV"; fi
          make initramfs AUTO_TEST=boot

      - name: Inject emil into the initramfs
        run: ./tests/asterinas/inject.sh "$ASTER_DIR" /tmp/payload

      # --old-file=initramfs is the load-bearing flag.  Asterinas
      # declares the initramfs image target .PHONY, so without it this
      # step re-runs nix-build, restores the read-only store symlink,
      # and boots a system with no emil in it -- silently, and green.
      - name: Run the unit suites on Asterinas
        working-directory: /tmp/asterinas
        run: |
          make --old-file=initramfs run_kernel \
            AUTO_TEST=boot ENABLE_KVM="$ENABLE_KVM" || true

      # The verdict is read from the serial log rather than from make's
      # exit status: make's AUTO_TEST=boot check greps for its own
      # marker and would report "Boot test failed", which names the
      # wrong thing.  A run that never reaches the runner produces no
      # EMIL_RESULT line, and that is failed distinctly -- a boot that
      # dies before init is a platform problem, not a test failure, and
      # the two should not look alike.
      - name: Report
        working-directory: /tmp/asterinas
        run: |
          test -f qemu.log || { echo "no qemu.log; the VM never ran"; exit 1; }
          sed -n '/=== emil on Asterinas ===/,$p' qemu.log || true
          if ! grep -q '^EMIL_RESULT:' qemu.log; then
            echo "::error::no EMIL_RESULT in the log -- the suites never ran to completion"
            tail -40 qemu.log
            exit 1
          fi
          grep -q '^EMIL_RESULT: PASS' qemu.log || {
            echo "::error::unit suites failed on Asterinas"; exit 1; }

      - name: Upload the QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emil-asterinas-qemu-log
          path: /tmp/asterinas/qemu.log
          if-no-files-found: warn
